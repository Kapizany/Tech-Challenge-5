name: terraform-plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: infra-plan
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'southamerica-east1' }}
      TF_VAR_environment: dev
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_data_bucket: ${{ vars.DATA_BUCKET }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_consolidation_paused: "false"
      TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE || 'us-docker.pkg.dev/cloudrun/container/hello' }}
      TF_VAR_model_uri: ${{ vars.MODEL_URI || 'gs://placeholder/models/plan/channel_reward_model.joblib' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Initialize remote state
        run: terraform -chdir=infra/terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=adaptive-offers/dev"
      - name: Plan
        run: terraform -chdir=infra/terraform plan -no-color -lock-timeout=5m
