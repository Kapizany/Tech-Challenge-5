name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src scripts tests
      - name: Test
        run: pytest -q
      - name: Build container
        run: docker build -t adaptive-offers:ci .
      - name: Terraform setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Terraform validation
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

  pipeline-smoke:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Exercise data, model, policy and MLflow
        run: |
          make data
          make validate
          make prepare
          make train-policies
          make evaluate SEEDS=2
          make golden-set
          make verify-mlflow SEEDS=2
      - name: Retain smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-smoke-${{ github.sha }}
          path: |
            mlflow.db
            mlruns/
            artifacts/phase3_4_report.json
            artifacts/phase5_evaluation_report.json
            artifacts/golden_set.json
          if-no-files-found: warn
          retention-days: 14
