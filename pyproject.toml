[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-offers"
version = "0.1.0"
description = "Datathon FIAP: plataforma adaptativa de ofertas e canais"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "pydantic>=2.6,<3",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.0,<2",
  "nbconvert>=7.16,<8",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "mlflow>=2.10,<4",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "httpx>=0.27,<1",
  "kaggle>=1.6,<2",
]
cloud = [
  "google-cloud-bigquery>=3.25,<4",
  "google-cloud-firestore>=2.16,<3",
  "google-cloud-pubsub>=2.21,<3",
  "google-cloud-storage>=2.16,<4",
]
vertex = [
  "google-cloud-aiplatform>=1.60,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
